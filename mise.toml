[tools]
node = "22.23.5"
hk = "2.13.0"
jactionlint = "2.6.0"
shellcheck = "0.11.0"

[env]
_.path = ["web/node_modules/.bin"]

[tasks.install]
run = "npm --prefix web ci"

[tasks.web]
run = "npm --prefix web run dev"

[tasks."web:build"]
run = "npm --prefix web run build"

[tasks."web:format"]
run = "npm --prefix web run format"

[tasks."web:format:check"]
run = "npm --prefix web run format:check"

[tasks."web:lint"]
run = "npm --prefix web run lint"

[tasks."web:lint:fix"]
run = "npm --prefix web run lint:fix"

[tasks."web:test"]
run = "npm --prefix web test"

[tasks."web:typecheck"]
run = "npm --prefix web run typecheck"

[tasks."swift:format"]
run = "swift format format --configuration server/.swift-format --recursive --in-place server/Sources server/Tests"

[tasks."swift:lint"]
run = "swift format lint --configuration server/.swift-format --recursive --strict server/Sources server/Tests"

[tasks.lint]
depends = ["web:lint", "web:format:check", "swift:lint"]

[tasks."actions:lint"]
run = "jactionlint .github/workflows/*.yml"

[tasks."swift:test"]
run = "swift test --package-path server"

[tasks."check:fast"]
run = ["mise run lint", "mise run actions:lint"]

[tasks.check]
run = [
  "mise run install",
  "mise run check:fast",
  "mise run web:test",
  "mise run web:typecheck",
  "mise run web:build",
  "mise run swift:test",
]

[tasks.fix]
run = ["mise run swift:format", "mise run web:lint:fix", "mise run web:format"]

[tasks."hooks:install"]
run = "hk install"
