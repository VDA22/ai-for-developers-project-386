name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: '6.4'
          skip-verify-signature: true
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a
      - run: mise run check
